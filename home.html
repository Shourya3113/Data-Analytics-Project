<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quantum AI Emotion Detection</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body{
font-family:'Inter',sans-serif;
}

canvas{
border:2px dashed #d1d5db;
border-radius:12px;
background:white;
touch-action:none;
}
</style>

</head>

<body class="bg-gray-50 min-h-screen flex justify-center p-6">

<div class="w-full max-w-4xl">

<div class="bg-white shadow-xl rounded-2xl p-8">

<div class="text-center mb-10">

<h1 class="text-3xl font-semibold text-gray-900">
Quantum AI Handwriting Emotion Detection
</h1>

<p class="text-gray-600 mt-2">
Upload handwriting or draw text to analyze emotional patterns
</p>

</div>

<!-- Upload Section -->

<form id="upload-form" class="space-y-4">

<label for="file-upload"
class="flex flex-col items-center justify-center h-32 border-2 border-dashed rounded-xl cursor-pointer hover:bg-gray-50">

<span class="text-gray-500">Click to upload handwriting image</span> <span id="file-name" class="text-xs text-gray-400 mt-1">PNG / JPG</span>

<input id="file-upload" name="file" type="file" class="hidden" accept="image/*">

</label>

<button type="submit"
class="w-full py-3 bg-blue-600 text-white rounded-xl hover:bg-blue-700">

Analyze Upload

</button>

</form>

<!-- Canvas Drawing -->

<div class="mt-10">

<h2 class="font-semibold text-gray-800 mb-3">
Or Draw Handwriting
</h2>

<canvas id="canvas" width="700" height="220"></canvas>

<div class="flex gap-4 mt-4">

<button id="clearCanvas"
class="px-4 py-2 bg-gray-200 rounded-lg">
Clear </button>

<button id="analyzeCanvas"
class="px-4 py-2 bg-green-600 text-white rounded-lg">
Analyze Drawing </button>

</div>

</div>

<!-- Result Section -->

<div id="result-container" class="mt-12 hidden">

<h2 class="text-2xl font-semibold mb-6">
AI Analysis Report
</h2>

<!-- Emotion + Risk -->

<div class="grid md:grid-cols-2 gap-6">

<div class="bg-gray-50 rounded-xl p-5">
<p class="text-gray-500 text-sm">Handwriting Emotion</p>
<p id="emotion-text" class="text-xl font-semibold mt-1"></p>
</div>

<div class="bg-gray-50 rounded-xl p-5">
<p class="text-gray-500 text-sm">Mental Health Risk</p>
<p id="risk-text" class="text-xl font-semibold mt-1"></p>
</div>

</div>

<!-- OCR Text -->

<div class="mt-8">

<h3 class="font-semibold text-gray-900 mb-2">
Extracted Text
</h3>

<p id="ocr-text"
class="bg-gray-50 p-4 rounded-xl text-gray-700 italic">
</p>

</div>

<!-- Sentence Emotion Analysis -->

<div class="mt-8">

<h3 class="font-semibold text-gray-900 mb-3">
Sentence Emotion Analysis
</h3>

<div id="emotion-segments"
class="space-y-3">
</div>

</div>

<!-- Input Image -->

<div class="mt-8">

<h3 class="font-semibold text-gray-900 mb-2">
Input Image
</h3>

<img id="preview-img"
class="rounded-xl border w-full">

</div>

</div>

</div>

<p class="text-center text-sm text-gray-500 mt-6">
© 2025 Quantum AI Project
</p>

</div>

<script>

/* Upload Handling */

const uploadForm=document.getElementById("upload-form")
const fileInput=document.getElementById("file-upload")
const fileNameDisplay=document.getElementById("file-name")

fileInput.addEventListener("change",()=>{

if(fileInput.files.length>0){
fileNameDisplay.textContent=fileInput.files[0].name
}

})


uploadForm.addEventListener("submit",async(e)=>{

e.preventDefault()

const file=fileInput.files[0]

if(!file){
alert("Please upload an image")
return
}

const formData=new FormData()
formData.append("file",file)

const res=await fetch("/predict",{
method:"POST",
body:formData
})

const data=await res.json()

showResult(data)

})



/* Canvas Drawing */

const canvas=document.getElementById("canvas")
const ctx=canvas.getContext("2d")

let drawing=false

canvas.addEventListener("pointerdown",()=>drawing=true)
canvas.addEventListener("pointerup",()=>drawing=false)
canvas.addEventListener("pointermove",draw)

function draw(e){

if(!drawing)return

const rect=canvas.getBoundingClientRect()

const x=e.clientX-rect.left
const y=e.clientY-rect.top

ctx.lineWidth=3
ctx.lineCap="round"
ctx.strokeStyle="black"

ctx.lineTo(x,y)
ctx.stroke()

ctx.beginPath()
ctx.moveTo(x,y)

}


document.getElementById("clearCanvas").onclick=()=>{
ctx.clearRect(0,0,canvas.width,canvas.height)
}



document.getElementById("analyzeCanvas").onclick=async()=>{

const dataURL=canvas.toDataURL()

const res=await fetch("/predict_canvas",{

method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({image:dataURL})

})

const data=await res.json()

showResult(data)

}



/* Display Result */

function showResult(data){

const container=document.getElementById("result-container")
const preview=document.getElementById("preview-img")

container.classList.remove("hidden")

document.getElementById("emotion-text").innerText=data.emotion
document.getElementById("risk-text").innerText=data.risk
document.getElementById("ocr-text").innerText=data.text


const segContainer=document.getElementById("emotion-segments")

segContainer.innerHTML=""

data.segments.forEach((seg,i)=>{

const div=document.createElement("div")

div.className="bg-gray-50 p-4 rounded-xl"

div.innerHTML=`
<strong>${i+1}. ${seg.text}</strong><br>
<span class="text-gray-500">Emotion: ${seg.emotion}</span>
`

segContainer.appendChild(div)

})


if(data.image_url){
preview.src=data.image_url
preview.style.display="block"
}else{
preview.style.display="none"
}

container.scrollIntoView({behavior:"smooth"})

}

</script>

</body>
</html>
